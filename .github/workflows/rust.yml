name: Rust CI & Release

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install macOS Dependencies
        run: |
          brew install macfuse pkg-config bindgen e2fsprogs

      - name: Cargo Build
        run: cargo build --verbose

      - name: Cargo Test
        run: cargo test --verbose

  release:
    name: Create Release & Update Homebrew Formula
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Compute Source Archive SHA256 & Update Formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"

          curl -sL "${TARBALL_URL}" -o "source-${VERSION}.tar.gz"
          SRC_SHA=$(sha256sum "source-${VERSION}.tar.gz" | awk '{print $1}')

          echo "Updating Formula/alpaca-extfs.rb with URL: ${TARBALL_URL} and SHA256: ${SRC_SHA}"

          sed -i 's|url "https://github.com/[^"]*"|url "'"${TARBALL_URL}"'"|' Formula/alpaca-extfs.rb
          sed -i 's/sha256 "[^"]*"/sha256 "'"${SRC_SHA}"'"/' Formula/alpaca-extfs.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/alpaca-extfs.rb
          git commit -m "chore(release): update Homebrew formula for ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push origin master
